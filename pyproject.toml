[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs6158-swe-study"
version = "0.1.0"
description = "Audited local SWE agent data preparation and QLoRA validation"
requires-python = ">=3.11"
dependencies = ["huggingface-hub>=1.0,<2", "pyarrow>=18", "PyYAML>=6"]

[project.optional-dependencies]
ml = ["torch>=2.9,<3", "transformers>=5.5,<5.6", "peft>=0.18,<0.19", "bitsandbytes>=0.49,<0.50", "accelerate>=1", "fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8", "tokenizers>=0.22", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# All compatible histories, 3 epochs, replicated NF4 model per GPU.
model: models/Qwen2.5-Coder-7B-Instruct
train_file: data/processed/swegym/train.jsonl
validation_file: data/processed/swegym/validation.jsonl
output: checkpoints/cloud/qwen-7b
max_length: 8192
max_train_examples: null
max_eval_examples: null
max_steps: -1
num_train_epochs: 3
global_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 0.0001
warmup_ratio: 0.03
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
seed: 6158
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
quantization: nf4
target_only_logits: true
context_policy: complete_histories_only
